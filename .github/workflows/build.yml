name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Integration test
        run: ./gradlew integrationTest

      - name: Build
        run: ./gradlew build

      - name: Upload plugin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrowthTools-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrowthTools-audits-${{ github.sha }}
          path: |
            build/reports/api/public-api.txt
            build/reports/audits/jar-audit.txt
            build/reports/tests/
          if-no-files-found: warn
