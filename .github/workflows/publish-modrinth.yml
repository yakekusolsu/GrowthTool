name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish
        required: true
        default: v0.7.0-alpha.1
        type: string

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yakekusolsu/GrowthTool'
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate publication context
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MODRINTH_TOKEN" || -z "$MODRINTH_PROJECT_ID" ]]; then
            echo "MODRINTH_TOKEN and MODRINTH_PROJECT_ID repository secrets are required." >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $release_tag" >&2
            exit 1
          fi

          version_number="${release_tag#v}"
          gradle_version="$(./gradlew properties --quiet | sed -n 's/^version: //p' | head -n 1)"
          if [[ "$version_number" != "$gradle_version" ]]; then
            echo "Release tag $release_tag does not match Gradle version $gradle_version." >&2
            exit 1
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "VERSION_NUMBER=$version_number" >> "$GITHUB_ENV"

      - name: Resolve published GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/growthtools-modrinth"
          release_json="$release_dir/release.json"
          changelog_file="$release_dir/release-notes.md"
          artifact="$release_dir/GrowthTools-${VERSION_NUMBER}.jar"
          mkdir -p "$release_dir"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          if [[ "$(jq -r '.draft' "$release_json")" != "false" ]]; then
            echo "The GitHub Release must be published before Modrinth publication." >&2
            exit 1
          fi

          asset_count="$(jq --arg name "GrowthTools-${VERSION_NUMBER}.jar" '[.assets[] | select(.name == $name)] | length' "$release_json")"
          if [[ "$asset_count" != "1" ]]; then
            echo "The GitHub Release must contain exactly one GrowthTools-${VERSION_NUMBER}.jar asset." >&2
            exit 1
          fi

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "GrowthTools-${VERSION_NUMBER}.jar" \
            --dir "$release_dir"
          jq -r '.body // empty' "$release_json" > "$changelog_file"

          expected_digest="$(jq -r --arg name "GrowthTools-${VERSION_NUMBER}.jar" '.assets[] | select(.name == $name) | .digest // empty' "$release_json")"
          actual_digest="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          if [[ -n "$expected_digest" && "$actual_digest" != "$expected_digest" ]]; then
            echo "Downloaded GitHub Release asset digest does not match its metadata." >&2
            exit 1
          fi

          echo "MODRINTH_UPLOAD_FILE=$artifact" >> "$GITHUB_ENV"
          echo "MODRINTH_CHANGELOG_FILE=$changelog_file" >> "$GITHUB_ENV"

      - name: Release build and publish to Modrinth
        run: ./gradlew modrinth --warning-mode all
